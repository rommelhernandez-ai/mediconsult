{% extends "clinica/base.html" %}

{% block titulo %}Crear cuenta | MediConsult{% endblock %}

{% block contenido %}
<div class="login">
    <div class="login-tarjeta">
        <div class="login-icono" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1565d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path><path d="M19 8v6m-3-3h6"></path></svg>
        </div>
        <h1>Crear cuenta</h1>
        <p class="login-subtitulo">Regístrate como paciente para consultar y solicitar tus citas.</p>

        <form method="post">
            {% csrf_token %}
            {{ formulario.as_p }}
            <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
        </form>

        <p class="login-pie">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
    </div>
</div>
{% endblock %}
